[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-gecko-terminal"
version = "1.0.0"
description = "FOMO leaderboard copy-trading terminal with GeckoTerminal market gates"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "duckdb>=1.1.0",
    "eth-account>=0.13.0",
    "httpx>=0.27.0",
    "lightweight-charts>=2.1.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "quantstats>=0.0.63",
    "rich>=13.8.0",
    "skfolio>=0.3.0",
    "solders>=0.21.0",
    "solana>=0.35.0",
    "streamlit>=1.37.0",
    "TA-Lib>=0.4.32",
    "tenacity>=9.0.0",
    "vectorbt>=0.26.2",
    "web3>=7.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.reporting" = ["static/*.js", "static/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
